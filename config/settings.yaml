execution_type: "local"

apis:
  vast_ai:
    enabled: true
    base_url: "https://console.vast.ai/api/v0"
    limit: 512
    split_at: 500
    # A full range is re-fetched in this many parts; keep (market offers / census_parts) near 100 so no part
    # reaches split_at. 2026-10-05: 13,069 offers at 64 parts had a 492-offer part (ADR-020).
    census_parts: 128
    request_interval_seconds: 1.0

  exchange_rate:
    enabled: true
    base_url: "https://v6.exchangerate-api.com/v6"
    from_currency: "USD"
    to_currency: "MKD"

  evn:
    enabled: true
    tariff_tiers_url: "https://www.evn.mk/Invoices.aspx"
    tariff_system_url: "https://www.evn.mk/AboutInvoices/TariffSystem.aspx"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

http:
  timeout_seconds: 30
  retry_count: 5
  retry_delay_seconds: 60

gcp:
  region_name: "europe-west3"
  dataproc:
    image_tag: "europe-west3-docker.pkg.dev/graphic-mission-505412-j7/ai-compute-arbitrage-monitor-repository/ai-compute-arbitrage-monitor-dataproc-image:latest"
    runtime_packages: ["common", "config", "refine"]
    subnetwork_name: "projects/graphic-mission-505412-j7/regions/europe-west3/subnetworks/ai-compute-arbitrage-monitor-subnet"
    service_account_email: "dataproc-sa@graphic-mission-505412-j7.iam.gserviceaccount.com"
  cloud_run:
    job_name: "ai-compute-arbitrage-monitor-dbt-job"
  composer:
    runtime_packages: ["common", "config", "ingest", "serializers"]
  big_lake:
    catalog_id: "ai_compute_arbitrage_monitor_catalog"

dbt:
  local:
    project_directory_path: "/opt/airflow/src/transform"
    profiles_directory_path: "/opt/airflow/src/transform"
    target_directory_path: "/tmp/target"
  gcp:
    project_directory_path: "/app/transform"
    profiles_directory_path: "/app/transform"
    target_directory_path: "/tmp/target"
