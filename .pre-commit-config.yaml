# The same checks as CI, before each commit (mypy before each push). Set up once: uv run pre-commit install --install-hooks
# The local hooks run through uv, so they use the versions in uv.lock, not a second set pinned here.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/  # saved EVN pages, kept as fetched
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
        args: [--unsafe]  # dbt YAML holds jinja; only parse the syntax
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]

      - id: sqlfluff
        name: sqlfluff lint (dbt)
        entry: uv run --no-sync sqlfluff lint --processes 1
        language: system
        files: ^src/transform/(models|macros|tests)/.*\.sql$

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
