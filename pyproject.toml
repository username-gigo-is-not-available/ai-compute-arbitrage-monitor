[project]
name = "gpu-arbitrage-monitor"
version = "0.1.0"
description = "GPU AI Compute Arbitrage Monitor - Tracks GPU pricing across cloud providers for arbitrage opportunities"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "httpx>=0.24.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0",
    "gql>=3.4.1",
    "asyncio-throttle>=1.0.2",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "vastai-sdk>=1.0.8",
    "beautifulsoup4>=4.14.3",
    "google-cloud-storage>=2.4,<3.2",
    "pyarrow>=24.0.0",
    "pyspark[sql]>=4.1.1",
    "pandas>=3.0.2",
    "grpcio-status>=1.80.0",
    "zstandard>=0.25.0",
    "dbt-duckdb>=1.10.1",
    "google-cloud-bigquery>=3.41.0",
    "google-cloud-pubsub>=2.37.0",
    "google-cloud-dataproc>=5.27.0",
    "dbt-bigquery>=1.11.1",
    "diagrams>=0.25.1",
    "pyiceberg[pyiceberg-core]>=0.12.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.15",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "SIM", "I", "C90", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, seed random samples and query local tables by name; scripts and tests run our own CLI commands.
"tests/**" = ["S101", "S311", "S603", "S608"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["lakehouse.partition.Partition"]

[tool.ruff.lint.isort]
known-first-party = ["common", "config", "ingest", "lakehouse", "refine", "transform"]
# The DAG folder's own modules, imported flat because Airflow puts the folder on sys.path.
known-local-folder = ["core_dag_factory", "marts_dag_factory", "pipeline_config", "spark_job_strategy", "transform_adapter", "transform_strategy"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "apache-airflow[google]==3.1.7",
]
