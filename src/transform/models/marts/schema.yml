version: 2

models:
  - name: mart_arbitrage_opportunities
    description: >
      Current arbitrage opportunities ranked by profit per TFLOP within each (offer_type, tariff tier).
      Filtered to verified, rentable, unrented offers with valid compute metrics.
      One row per (offer, tariff tier). Partitioned rank per (offer_type, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - offer_type
            - offer_id
            - valid_from
            - tariff_tier_skey
    columns:
      - name: arbitrage_rank
        description: "Rank by profit_per_tflop_usd descending within (offer_type, tariff_tier_skey) - rank 1 is the best opportunity for that tier"
        tests:
          - not_null

      - name: offer_type
        description: "Offer type e.g. on_demand, reserved, bid"
        tests:
          - not_null

      - name: offer_id
        description: "Vast.ai offer identifier"
        tests:
          - not_null

      - name: machine_id
        description: "Vast.ai machine identifier"
        tests:
          - not_null

      - name: host_id
        description: "Vast.ai host identifier"
        tests:
          - not_null

      - name: country_code
        description: "ISO country code extracted from geolocation"
        tests:
          - not_null:
              config:
                severity: warn

      - name: reliability_score
        description: "Vast.ai host reliability score"

      - name: gpu_architecture
        description: "GPU architecture family e.g. nvidia"
        tests:
          - not_null

      - name: gpu_model_name
        description: "GPU model name e.g. RTX 4090"
        tests:
          - not_null

      - name: number_of_gpus
        description: "Number of GPUs in the offer"
        tests:
          - not_null

      - name: tflops_per_gpu
        description: "TFLOPS per GPU"

      - name: total_system_tflops
        description: "Total TFLOPS across all GPUs in the offer"

      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes"

      - name: gpu_tdp_watts
        description: "GPU TDP per GPU in watts"

      - name: gpu_bandwidth_gbytes_per_sec
        description: "GPU memory bandwidth in GB/s"

      - name: gpu_max_cuda_version_supported
        description: "Maximum CUDA version supported"

      - name: cpu_architecture
        description: "CPU architecture e.g. amd64"

      - name: cpu_model_name
        description: "CPU model name"

      - name: number_of_cpu_cores
        description: "Number of CPU cores"

      - name: cpu_clock_speed_ghz
        description: "CPU clock speed in GHz"

      - name: ram_gb
        description: "System RAM in gigabytes"

      - name: disk_space_gb
        description: "Available disk space in gigabytes"

      - name: disk_bandwidth_gbytes_per_sec
        description: "Disk bandwidth in GB/s"

      - name: pcie_generation
        description: "PCIe generation"

      - name: pcie_bandwidth_gbytes_per_sec
        description: "PCIe bandwidth in GB/s"

      - name: network_download_mbits_per_sec
        description: "Network download speed in Mbits/s"

      - name: network_upload_mbits_per_sec
        description: "Network upload speed in Mbits/s"

      - name: network_download_cost_usd_per_gbit
        description: "Network download cost per gigabit in USD"

      - name: network_upload_cost_usd_per_gbit
        description: "Network upload cost per gigabit in USD"

      - name: kwh_per_tflop
        description: "Energy efficiency ratio - kWh per TFLOP"

      - name: deep_learning_score
        description: "Vast.ai deep learning benchmark score"

      - name: deep_learning_score_per_usd
        description: "DL performance per dollar"

      - name: gpu_price_usd_per_hr
        description: "Base GPU rental cost in USD/hr"

      - name: minimum_bid_price_usd
        description: "Minimum bid price in USD"

      - name: storage_cost_usd_per_hr
        description: "Storage cost in USD/hr"

      - name: revenue_usd_per_hr
        description: "Total hourly revenue in USD"
        tests:
          - not_null

      - name: usd_to_mkd_rate
        description: "USD to MKD exchange rate locked at valid_from"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null

      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null

      - name: tariff_window_type
        description: "Tariff window type for this tier - low or high"
        tests:
          - not_null
          - accepted_values:
              values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Tariff block number within the consumer category (1-4 for household high, null for low/business)"

      # generic cost / profit columns (tier-scoped)
      - name: cost_usd_per_hr
        description: "Electricity cost in USD/hr for this tariff tier"

      - name: profit_usd_per_hr
        description: "Profit in USD/hr for this tariff tier"

      - name: cost_per_tflop_usd
        description: "Electricity cost per TFLOP in USD for this tariff tier"

      - name: profit_per_tflop_usd
        description: "Profit per TFLOP in USD for this tariff tier - used for ranking"

      - name: valid_from
        description: "Timestamp of the offer snapshot"
        tests:
          - not_null

  - name: mart_best_offers_by_gpu
    description: >
      Best available offer per (GPU variant, tariff tier), deduped to the latest snapshot.
      Filtered to verified, rentable, unrented offers. Selection is by profit_usd_per_hr / number_of_gpus
      within each (offer_type, gpu_architecture, gpu_model_name, gpu_memory_gb, tariff_tier_skey) group.
      One row per (offer_type, gpu_architecture, gpu_model_name, gpu_memory_gb, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - offer_type
            - gpu_architecture
            - gpu_model_name
            - gpu_memory_gb
            - tariff_tier_skey
    columns:
      - name: offer_type
        description: "Offer type e.g. on_demand, reserved, bid"
        tests:
          - not_null

      - name: gpu_architecture
        description: "GPU architecture family e.g. nvidia"
        tests:
          - not_null

      - name: gpu_model_name
        description: "GPU model name e.g. RTX 4090"
        tests:
          - not_null

      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes"

      - name: gpu_tdp_watts
        description: "GPU TDP in watts"

      - name: gpu_bandwidth_gbytes_per_sec
        description: "GPU memory bandwidth in GB/s"

      - name: gpu_max_cuda_version_supported
        description: "Maximum CUDA version supported by the GPU driver"

      - name: tflops_per_gpu
        description: "TFLOPS per GPU"
        tests:
          - not_null:
              config:
                severity: warn

      - name: kwh_per_tflop
        description: "Energy efficiency ratio - kWh per TFLOP"

      - name: verification_flag
        description: "Vast.ai host verification status"

      - name: rentable_flag
        description: "Whether the offer is currently rentable"

      - name: rented_flag
        description: "Whether the offer is currently rented"

      - name: reliability_score
        description: "Vast.ai host reliability score"

      - name: country_code
        description: "ISO country code of the host"

      - name: revenue_per_gpu_usd_per_hr
        description: "Revenue per GPU in USD/hr"

      # generic per-GPU cost / profit columns (tier-scoped)
      - name: cost_per_gpu_usd_per_hr
        description: "Electricity cost per GPU in USD/hr for this tariff tier"

      - name: profit_per_gpu_usd_per_hr
        description: "Profit per GPU in USD/hr for this tariff tier - used for best-offer selection"

      - name: cost_per_tflop_usd
        description: "Electricity cost per TFLOP in USD for this tariff tier"

      - name: profit_per_tflop_usd
        description: "Profit per TFLOP in USD for this tariff tier"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null

      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null

      - name: tariff_window_type
        description: "Tariff window type for this tier - low or high"
        tests:
          - not_null
          - accepted_values:
              values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Tariff block number within the consumer category"

      - name: valid_from
        description: "Timestamp of the latest snapshot for this GPU variant and tier"
        tests:
          - not_null

  - name: mart_profitability_trends
    description: >
      Hourly aggregated offer-level profitability metrics grouped by GPU variant, scheduled tariff window type,
      and tariff tier context. Joins fct_compute_offers to dim_electricity_tariff_window_schedule to filter
      to hours where the tariff tier's window matches the EVN schedule. Metrics are raw offer-level averages
      (not per-GPU normalized) - use mart_best_offers_by_gpu or mart_gpu_model_summary for per-GPU comparisons.
      One row per (hour_bucket, offer_type, gpu_architecture, gpu_model_name, gpu_memory_gb, gpu_tdp_watts,
      gpu_bandwidth_gbytes_per_sec, gpu_max_cuda_version_supported, number_of_gpus, scheduled_tariff_window_type,
      consumer_category, tariff_block_number, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hour_bucket
            - offer_type
            - gpu_architecture
            - gpu_model_name
            - gpu_memory_gb
            - gpu_tdp_watts
            - gpu_bandwidth_gbytes_per_sec
            - gpu_max_cuda_version_supported
            - number_of_gpus
            - tariff_tier_skey
            - consumer_category
            - scheduled_tariff_window_type
            - tariff_block_number
    columns:
      - name: hour_bucket
        description: "Timestamp truncated to the hour"
        tests:
          - not_null
      - name: day_of_week
        description: "ISO day of week - 1=Monday through 7=Sunday"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1 and day_of_week <= 7"
      - name: hour_of_day
        description: "Hour of day (0-23)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and hour_of_day < 24"
      - name: offer_type
        description: "Offer type e.g. on_demand, reserved, bid"
        tests:
          - not_null
      - name: gpu_architecture
        description: "GPU architecture family"
        tests:
          - not_null
      - name: gpu_model_name
        description: "GPU model name"
        tests:
          - not_null
      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes - part of grain to separate RTX 4090 16GB vs 32GB"
      - name: gpu_tdp_watts
        description: "GPU TDP in watts - part of grain"
      - name: gpu_bandwidth_gbytes_per_sec
        description: "GPU memory bandwidth in GB/s - part of grain"
      - name: gpu_max_cuda_version_supported
        description: "Maximum CUDA version supported - part of grain"
      - name: number_of_gpus
        description: "Number of GPUs - part of grain"
      - name: offer_count
        description: "Number of offer snapshots in this group"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: avg_revenue_usd_per_hr
        description: "Average offer revenue in USD/hr"

      # generic profit aggregates (tier-scoped)
      - name: avg_profit_usd_per_hr
        description: "Average offer profit in USD/hr for this tariff tier"
      - name: min_profit_usd_per_hr
        description: "Minimum offer profit in USD/hr for this tariff tier"
      - name: max_profit_usd_per_hr
        description: "Maximum offer profit in USD/hr for this tariff tier"

      - name: avg_profit_per_tflop_usd
        description: "Average profit per TFLOP in USD for this tariff tier"
      - name: min_profit_per_tflop_usd
        description: "Minimum profit per TFLOP in USD for this tariff tier"
      - name: max_profit_per_tflop_usd
        description: "Maximum profit per TFLOP in USD for this tariff tier"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null

      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null

      - name: scheduled_tariff_window_type
        description: "Effective tariff window at this hour - the tier's window matched with the EVN schedule - low or high"
        tests:
          - not_null
          - accepted_values:
              values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Tariff block number within the consumer category"

  - name: mart_gpu_model_summary
    description: >
      Summary profitability statistics aggregated by GPU model, offer type, and tariff tier.
      Current offers only (valid_to is 9999-12-31). Includes a single pct_profitable column
      (share of offers with profit_usd_per_hr > 0 for that tier), host quality metrics,
      and per-GPU normalized averages. One row per (offer_type, gpu_architecture, gpu_model_name,
      tflops_per_gpu, gpu_memory_gb, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - offer_type
            - gpu_architecture
            - gpu_model_name
            - gpu_memory_gb
            - tflops_per_gpu
            - tariff_tier_skey
    columns:
      - name: offer_type
        description: "Offer type e.g. on_demand, reserved, bid"
        tests:
          - not_null
      - name: gpu_architecture
        description: "GPU architecture family"
        tests:
          - not_null
      - name: gpu_model_name
        description: "GPU model name"
        tests:
          - not_null
      - name: tflops_per_gpu
        description: "TFLOPS per GPU - part of grain"
      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes - part of grain to separate RTX 4090 16GB vs 32GB"

      - name: total_offer_observations
        description: "Total number of current offer snapshots in this group"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: avg_kwh_per_tflop
        description: "Average energy efficiency ratio - kWh per TFLOP"

      - name: avg_revenue_per_gpu_usd_per_hr
        description: "Average revenue per GPU in USD/hr"

      - name: pct_profitable
        description: "Percentage of offers with profit_usd_per_hr > 0 for this tariff tier"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and pct_profitable <= 100"
              config:
                severity: warn

      - name: pct_verified
        description: "Percentage of offers with verified hosts"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and pct_verified <= 100"
              config:
                severity: warn

      - name: pct_available
        description: "Percentage of offers currently not rented"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and pct_available <= 100"
              config:
                severity: warn

      - name: avg_reliability_score
        description: "Average host reliability score"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null

      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null

      - name: tariff_window_type
        description: "Tariff window type for this tier - low or high"
        tests:
          - not_null
          - accepted_values:
              values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Tariff block number within the consumer category"

      - name: last_seen_at
        description: "Most recent ingest timestamp in this group"
        tests:
          - not_null