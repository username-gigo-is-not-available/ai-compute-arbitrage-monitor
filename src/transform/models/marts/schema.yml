version: 2

models:
  - name: mart_arbitrage_opportunities
    description: >
      Current arbitrage opportunities ranked by profit per TFLOP within each tariff tier (ADR-021).
      Filtered to verified, available machines with valid compute metrics (ADR-020).
      One row per (machine, tariff tier). Partitioned rank per tariff_tier_skey.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - machine_id
              - valid_from
              - tariff_tier_skey
    columns:
      - name: arbitrage_rank
        description: "Rank by profit_per_tflop_usd descending within tariff_tier_skey - rank 1 is the best opportunity for that tier"
        tests:
          - not_null

      - name: machine_id
        description: "Vast.ai machine identifier"
        tests:
          - not_null

      - name: host_id
        description: "Vast.ai host identifier"
        tests:
          - not_null

      - name: country_code
        description: "ISO country code extracted from geolocation"
        tests:
          - not_null:
              config:
                severity: warn

      - name: reliability_score
        description: "Vast.ai host reliability score"

      - name: gpu_architecture
        description: "GPU architecture family e.g. nvidia"
        tests:
          - not_null

      - name: gpu_model_name
        description: "GPU model name e.g. RTX 4090"
        tests:
          - not_null

      - name: number_of_machine_gpus
        description: "GPUs in the machine, rented or not"
        tests:
          - not_null

      - name: tflops_per_gpu
        description: "TFLOPS per GPU"

      - name: total_system_tflops
        description: "Total TFLOPS across all GPUs in the machine"

      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes"

      - name: gpu_tdp_watts
        description: "GPU TDP per GPU in watts"

      - name: gpu_bandwidth_gbytes_per_sec
        description: "GPU memory bandwidth in GB/s"

      - name: gpu_max_cuda_version_supported
        description: "Maximum CUDA version supported"

      - name: cpu_architecture
        description: "CPU architecture e.g. amd64"

      - name: cpu_model_name
        description: "CPU model name"

      - name: number_of_cpu_cores
        description: "Number of CPU cores"

      - name: cpu_clock_speed_ghz
        description: "CPU clock speed in GHz"

      - name: ram_gb
        description: "System RAM in gigabytes"

      - name: disk_space_gb
        description: "Available disk space in gigabytes"

      - name: disk_bandwidth_gbytes_per_sec
        description: "Disk bandwidth in GB/s"

      - name: pcie_generation
        description: "PCIe generation"

      - name: pcie_bandwidth_gbytes_per_sec
        description: "PCIe bandwidth in GB/s"

      - name: network_download_mbits_per_sec
        description: "Network download speed in Mbits/s"

      - name: network_upload_mbits_per_sec
        description: "Network upload speed in Mbits/s"

      - name: network_download_cost_usd_per_gbit
        description: "Network download cost per gigabit in USD"

      - name: network_upload_cost_usd_per_gbit
        description: "Network upload cost per gigabit in USD"

      - name: kwh_per_tflop
        description: "Energy efficiency ratio - kWh per TFLOP"

      - name: deep_learning_score
        description: "Vast.ai deep learning benchmark score"

      - name: deep_learning_score_per_usd
        description: "DL performance per dollar"

      - name: gpu_price_usd_per_hr
        description: "Base GPU rental cost in USD/hr"

      - name: minimum_bid_price_usd
        description: "Minimum bid price in USD"

      - name: storage_cost_usd_per_hr
        description: "Storage cost in USD/hr"

      - name: revenue_usd_per_hr
        description: "Total hourly revenue in USD"
        tests:
          - not_null

      - name: usd_to_mkd_rate
        description: "USD to MKD exchange rate locked at valid_from"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null

      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null

      - name: tariff_window_type
        description: "Tariff window type for this tier - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Tariff block number within the consumer category (1-4 for household high, null for low/business)"

      # cost / profit columns (tier-scoped): electricity only, the access fee is paid anyway (ADR-025)
      - name: cost_usd_per_hr
        description: "Cost in USD/hr for this tariff tier - electricity + distribution fee (+ household VAT)"

      - name: profit_usd_per_hr
        description: "Profit in USD/hr for this tariff tier"

      - name: cost_per_tflop_usd
        description: "Cost per TFLOP in USD for this tariff tier"

      - name: profit_per_tflop_usd
        description: "Profit per TFLOP in USD for this tariff tier - used for ranking"

      - name: valid_from
        description: "Scheduled hour of the census this machine row comes from"
        tests:
          - not_null

  - name: mart_best_offers_by_gpu
    description: >
      Best available machine per (GPU variant, tariff tier), from the latest census.
      Filtered to verified, available machines. Selection is by profit_usd_per_hr / number_of_machine_gpus
      within each (gpu_architecture, gpu_model_name, gpu_memory_gb, tariff_tier_skey) group.
      One row per (gpu_architecture, gpu_model_name, gpu_memory_gb, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - gpu_architecture
              - gpu_model_name
              - gpu_memory_gb
              - tariff_tier_skey
    columns:

      - name: gpu_architecture
        description: "GPU architecture family e.g. nvidia"
        tests:
          - not_null

      - name: gpu_model_name
        description: "GPU model name e.g. RTX 4090"
        tests:
          - not_null

      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes"

      - name: gpu_tdp_watts
        description: "GPU TDP in watts"

      - name: gpu_bandwidth_gbytes_per_sec
        description: "GPU memory bandwidth in GB/s"

      - name: gpu_max_cuda_version_supported
        description: "Maximum CUDA version supported by the GPU driver"

      - name: tflops_per_gpu
        description: "TFLOPS per GPU"
        tests:
          - not_null:
              config:
                severity: warn

      - name: kwh_per_tflop
        description: "Energy efficiency ratio - kWh per TFLOP"

      - name: verification_flag
        description: "Vast.ai host verification status"

      - name: rentable_flag
        description: "Available: at least one of the machine's offers can be rented now (always true here)"

      - name: reliability_score
        description: "Vast.ai host reliability score"

      - name: country_code
        description: "ISO country code of the host"

      - name: revenue_per_gpu_usd_per_hr
        description: "Revenue per GPU in USD/hr"

      # per-GPU cost / profit columns (tier-scoped): electricity only, the access fee is paid anyway (ADR-025)
      - name: cost_per_gpu_usd_per_hr
        description: "Cost per GPU in USD/hr for this tariff tier"

      - name: profit_per_gpu_usd_per_hr
        description: "Profit per GPU in USD/hr for this tariff tier - used for best-offer selection"

      - name: cost_per_tflop_usd
        description: "Cost per TFLOP in USD for this tariff tier"

      - name: profit_per_tflop_usd
        description: "Profit per TFLOP in USD for this tariff tier"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null

      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null

      - name: tariff_window_type
        description: "Tariff window type for this tier - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Tariff block number within the consumer category"

      - name: valid_from
        description: "Timestamp of the latest snapshot for this GPU variant and tier"
        tests:
          - not_null

  - name: mart_gpu_history
    description: >
      The past-facing pair of mart_gpu_forecast, at the same grain: per-GPU market ask and profit per GPU variant
      (model + memory), hour and tariff tier (#40). The census is daily (ADR-020), so each census's machines are
      priced at every local hour of their census date, matching each tier to the EVN schedule in Macedonian local
      time with the tariffs valid on that date (ADR-021). Every machine counts, available or taken. TDP, TFLOPS and
      ask are medians across the variant's machines; profit is the avg/min/max across them, from each machine's
      own costs in fct_compute_offers (electricity only, ADR-025).
      One row per (census_at, history_hour, gpu_model_name, gpu_memory_gb, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - census_at
              - history_hour
              - gpu_model_name
              - gpu_memory_gb
              - tariff_tier_skey
    columns:
      - name: census_at
        description: "Timestamp of the census (fct_compute_offers.valid_from)"
        tests:
          - not_null
      - name: census_date
        description: "The census's date in Macedonian local time; its hours are the ones priced"
        tests:
          - not_null
      - name: history_hour
        description: "A local hour of the census date, as a UTC timestamp"
        tests:
          - not_null
      - name: day_of_week
        description: "ISO day of week in Macedonian local time - 1=Monday through 7=Sunday"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1 and day_of_week <= 7"
      - name: hour_of_day
        description: "Hour of day in Macedonian local time (0-23)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and hour_of_day < 24"
      - name: scheduled_tariff_window_type
        description: "Effective tariff window at this hour - the tier's window matched with the EVN schedule - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]
      - name: gpu_architecture
        description: "GPU architecture family"
        tests:
          - not_null
      - name: gpu_model_name
        description: "GPU model name"
        tests:
          - not_null
      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes - part of grain to separate e.g. A100 40GB vs 80GB"
      - name: gpu_tdp_watts
        description: "Median TDP of the variant's machines in watts - a host-set power limit, not a spec"
      - name: tflops_per_gpu
        description: "Median measured TFLOPS per GPU of the variant's machines (zeros ignored)"
      - name: number_of_machines
        description: "Machines of this variant in the census (ADR-020)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: total_number_of_machine_gpus
        description: "GPUs across those machines"
        tests:
          - not_null
      - name: market_ask_per_gpu_usd_per_hr
        description: "Median per-GPU ask of the variant's machines in USD/hr - the same measure as mart_gpu_forecast's"

      # profit per GPU (USD/hr): electricity only, the access fee is paid anyway (ADR-025)
      - name: median_profit_per_gpu_usd_per_hr
        description: "Median per-GPU profit in USD/hr for this tariff tier - the typical machine; plot this, not the average"
      - name: avg_profit_per_gpu_usd_per_hr
        description: "Average per-GPU profit in USD/hr for this tariff tier - pulled up by a few overpriced listings"
      - name: min_profit_per_gpu_usd_per_hr
        description: "Minimum per-GPU profit in USD/hr for this tariff tier"
      - name: max_profit_per_gpu_usd_per_hr
        description: "Maximum per-GPU profit in USD/hr for this tariff tier"

      # profit per TFLOP (USD)
      - name: median_profit_per_tflop_usd
        description: "Median profit per TFLOP in USD for this tariff tier - the typical machine"
      - name: avg_profit_per_tflop_usd
        description: "Average profit per TFLOP in USD for this tariff tier"
      - name: min_profit_per_tflop_usd
        description: "Minimum profit per TFLOP in USD for this tariff tier"
      - name: max_profit_per_tflop_usd
        description: "Maximum profit per TFLOP in USD for this tariff tier"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null
      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null
      - name: tariff_block_number
        description: "Tariff block number within the consumer category"

  - name: mart_gpu_model_summary
    description: >
      Summary statistics per GPU variant and tariff tier over the latest census, counting machines, not their
      overlapping offers (ADR-020). Includes pct_profitable (share of
      machines with positive profit for that tier, ADR-025), pct_available, host quality metrics, and per-GPU averages split by available and taken
      machines. One row per (gpu_architecture, gpu_model_name, tflops_per_gpu, gpu_memory_gb, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - gpu_architecture
              - gpu_model_name
              - gpu_memory_gb
              - tflops_per_gpu
              - tariff_tier_skey
    columns:
      - name: gpu_architecture
        description: "GPU architecture family"
        tests:
          - not_null
      - name: gpu_model_name
        description: "GPU model name"
        tests:
          - not_null
      - name: tflops_per_gpu
        description: "TFLOPS per GPU - part of grain"
      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes - part of grain to separate RTX 4090 16GB vs 32GB"

      - name: number_of_machines
        description: "Machines of this GPU variant in the latest census"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: total_number_of_machine_gpus
        description: "GPUs across those machines (sum of number_of_machine_gpus, rented or not)"
        tests:
          - not_null

      - name: avg_kwh_per_tflop
        description: "Average energy efficiency ratio - kWh per TFLOP"

      - name: avg_revenue_per_gpu_usd_per_hr
        description: "Average revenue per GPU in USD/hr"

      - name: avg_available_revenue_per_gpu_usd_per_hr
        description: "Average ask per GPU in USD/hr of available machines - the competition"

      - name: avg_taken_revenue_per_gpu_usd_per_hr
        description: "Average ask per GPU in USD/hr of taken machines - prices being paid, or of switched-off machines"

      - name: pct_profitable
        description: "Percentage of machines with profit_usd_per_hr > 0 for this tariff tier"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and pct_profitable <= 100"
              config:
                severity: warn

      - name: pct_verified
        description: "Percentage of machines with verified hosts"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and pct_verified <= 100"
              config:
                severity: warn

      - name: pct_available
        description: "Percentage of machines available (any offer rentable now); the rest are taken"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and pct_available <= 100"
              config:
                severity: warn

      - name: avg_reliability_score
        description: "Average host reliability score"

      # tariff tier context
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row represents"
        tests:
          - not_null

      - name: consumer_category
        description: "Consumer category for this tier e.g. household, business"
        tests:
          - not_null

      - name: tariff_window_type
        description: "Tariff window type for this tier - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Tariff block number within the consumer category"

      - name: last_seen_at
        description: "Most recent ingest timestamp in this group"
        tests:
          - not_null

  - name: mart_gpu_forecast
    description: >
      Forward-looking, per-GPU grid of electricity cost and profit per GPU model, future hour and tariff
      tier, aligned to the EVN tariff window schedule in Macedonian local time (ADR-007, ADR-021). It carries every
      consumer category and tariff block and no per-user input: the app picks the user's category, walks the
      blocks with a running total from their billing-period consumption, and scales by their GPU count and ask
      price. Revenue is the current market ask (median per-GPU ask of the latest census). Cost is electricity only:
      kWh x (tariff_value + distribution_fee) x (1 + household VAT), excluding the fixed access fee.
      Covers the next forecast_days (default 32) days.
      One row per (gpu_model_name, forecast_hour, tariff_tier_skey).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - gpu_model_name
              - forecast_hour
              - tariff_tier_skey
    columns:
      - name: forecast_hour
        description: "The forecast hour (UTC timestamp)"
        tests:
          - not_null
      - name: day_of_week
        description: "ISO day of week in Macedonian local time - 1=Monday through 7=Sunday"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1 and day_of_week <= 7"
      - name: hour_of_day
        description: "Hour of day in Macedonian local time (0-23)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and hour_of_day < 24"
      - name: scheduled_tariff_window_type
        description: "Effective tariff window at this forecast hour - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]
      - name: gpu_model_name
        description: "GPU model name"
        tests:
          - not_null
      - name: gpu_tdp_watts
        description: "GPU TDP in watts"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: tflops_per_gpu
        description: "TFLOPS per GPU"
        tests:
          - not_null:
              config:
                severity: warn
      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes"
        tests:
          - not_null
      - name: gpu_bandwidth_gbytes_per_sec
        description: "GPU memory bandwidth in GB/s"
      - name: gpu_max_cuda_version_supported
        description: "Maximum CUDA version supported"
      - name: kwh_per_gpu_per_hr
        description: "Power draw of one GPU at TDP in kWh/hr (gpu_tdp_watts / 1000) - the app's running block total adds this x GPU count per high-tariff hour"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: market_ask_per_gpu_usd_per_hr
        description: "Median per-GPU ask of this GPU model's machines in the latest census, in USD/hr"
        tests:
          - not_null
      - name: cost_per_gpu_usd_per_hr
        description: "Cost of one GPU in USD/hr - kWh x (tariff_value + distribution_fee) x (1 + VAT), access fee excluded"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: profit_per_gpu_usd_per_hr
        description: "Profit of one GPU in USD/hr at the market ask (market_ask_per_gpu - cost_per_gpu); the app recomputes it for a user's own ask"
      - name: cost_per_tflop_usd
        description: "Cost per TFLOP in USD"
      - name: profit_per_tflop_usd
        description: "Profit per TFLOP in USD at the market ask"
      - name: tariff_tier_skey
        description: "Surrogate key of the tariff tier this row prices"
        tests:
          - not_null
      - name: consumer_category
        description: "Consumer category of the tier (household or business)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'household', 'business' ]
      - name: tariff_block_number
        description: "Tariff block number of the tier (1-4 for household high tariff, null for low/business)"
      - name: lower_bound_kwh
        description: "Lower bound of the tariff block in kWh for a 30-day billing period; the app scales it to the user's period length (ADR-021). Null for tiers without blocks"
      - name: upper_bound_kwh
        description: "Upper bound of the tariff block in kWh for a 30-day billing period (null for the last block and for tiers without blocks)"
      - name: tariff_value
        description: "Tariff price per kWh in MKD for the tier, before VAT"
        tests:
          - not_null
      - name: distribution_fee
        description: "Per-kWh distribution fee in MKD, before VAT"
      - name: vat_rate
        description: "VAT rate added on top - household_vat_rate for households, 0 for business"
        tests:
          - not_null
      - name: usd_to_mkd_rate
        description: "USD to MKD exchange rate used in the forecast"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn
