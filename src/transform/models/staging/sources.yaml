version: 2

# Silver lives as Iceberg tables in the BigLake Lakehouse catalog. BigQuery reads
# them live by four-part name (project.catalog.namespace.table); `database`
# absorbs the catalog. See ADR-018.

sources:
  - name: sources
    description: "Silver sources: Iceberg tables in the Lakehouse catalog"
    database: "{{ target.project }}.ai_compute_arbitrage_monitor_catalog"
    schema: silver_sources
    tables:
      - name: compute_offers
        description: "Vast.ai GPU compute offers"

      - name: exchange_rates
        description: "USD/MKD exchange rate"

  - name: seeds
    description: "Silver seeds: Iceberg tables in the Lakehouse catalog"
    database: "{{ target.project }}.ai_compute_arbitrage_monitor_catalog"
    schema: silver_seeds
    tables:
      - name: electricity_tariff_tiers
      - name: electricity_tariff_blocks
      - name: electricity_tariff_fees
      - name: electricity_tariff_window_schedule
