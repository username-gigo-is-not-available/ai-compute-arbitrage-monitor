version: 2

models:
  - name: int_compute_offers
    description: "One row per machine per census (ADR-020): a machine's offers collapsed onto its largest offer, prices as per-GPU price x machine size; unit conversions, country code extraction and memory normalization applied"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - machine_id
              - valid_from
    columns:
      - name: machine_id
        description: "Vast.ai machine identifier"
        tests:
          - not_null

      - name: host_id
        description: "Vast.ai host identifier"
        tests:
          - not_null

      - name: total_price_usd_per_hr
        description: "Total hourly price to rent the whole machine: the per-GPU total price x machine size"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: gpu_price_usd_per_hr
        description: "Base GPU rental cost for the whole machine (per-GPU base price x machine size), excluding storage and bandwidth"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= total_price_usd_per_hr"

      - name: deep_learning_score_per_usd
        description: "DL performance per dollar - pre-computed by Vast.ai"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: minimum_bid_price_usd
        description: "Lowest minimum bid for the whole machine: the lowest per-GPU minimum bid among its offers x machine size (the bid price, ADR-020)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: storage_cost_usd_per_hr
        description: "Storage cost component of the hourly price in USD"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: network_upload_cost_usd_per_gbit
        description: "Network upload cost per gigabit in USD"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: network_download_cost_usd_per_gbit
        description: "Network download cost per gigabit in USD"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: gpu_architecture
        description: "GPU architecture family e.g. nvidia, amd"
        tests:
          - not_null

      - name: gpu_model_name
        description: "GPU model name e.g. RTX 4090"
        tests:
          - not_null

      - name: gpu_memory_gb
        description: "GPU VRAM in gigabytes (converted from gpu_memory_mb in staging)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: gpu_tdp_watts
        description: "GPU TDP / max power draw in watts, as the host reports it; machines without one are dropped"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: number_of_machine_gpus
        description: "GPUs in the machine, rented or not: number_of_offer_gpus / gpu_fraction_of_machine of any of its offers"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: gpu_max_cuda_version_supported
        description: "Maximum CUDA version supported by the GPU driver"

      - name: tflops_per_gpu
        description: "Raw compute capacity in TFLOPS per gpu"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: total_system_tflops
        description: "Total compute capacity across all GPUs in the machine (tflops_per_gpu * number_of_machine_gpus)"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: gpu_bandwidth_gbytes_per_sec
        description: "GPU memory bandwidth in GB/s"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: cpu_architecture
        description: "CPU architecture e.g. amd64, arm64"
        tests:
          - not_null

      - name: cpu_model_name
        description: "CPU model name"
        tests:
          - not_null:
              config:
                severity: warn

      - name: number_of_cpu_cores
        description: "Effective number of CPU cores available"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: cpu_clock_speed_ghz
        description: "CPU clock speed in GHz"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: ram_gb
        description: "System RAM in gigabytes (converted from ram_mb in staging)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: disk_model_name
        description: "Disk model name"
        tests:
          - not_null:
              config:
                severity: warn

      - name: disk_space_gb
        description: "Available disk space in gigabytes"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: disk_bandwidth_gbytes_per_sec
        description: "Disk sequential read/write bandwidth in GB/s"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: pcie_generation
        description: "PCIe generation e.g. 3.0, 4.0, 5.0"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: pcie_bandwidth_gbytes_per_sec
        description: "PCIe bandwidth in GB/s"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: network_download_mbits_per_sec
        description: "Network download speed in Mbps"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: network_upload_mbits_per_sec
        description: "Network upload speed in Mbps"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

      - name: reliability_score
        description: "Vast.ai host reliability score"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: deep_learning_score
        description: "Vast.ai deep learning benchmark score"
        tests:
          - not_null:
              config:
                severity: warn

      - name: country_code
        description: "ISO country code extracted from geolocation string e.g. US, DE"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= upper(country_code)"
              config:
                severity: warn

      - name: verification_flag
        description: "Vast.ai host verification status"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'verified', 'unverified', 'deverified' ]

      - name: rentable_flag
        description: "Available: at least one of the machine's offers can be rented now. False means taken (rented, or switched off by its owner)"
        tests:
          - not_null

      - name: valid_from
        description: "Scheduled hour of the census this machine row comes from"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                  expression: "<= current_timestamp"

      - name: valid_to
        description: "End of validity; 9999-12-31 here, closed in fct_compute_offers when a newer census arrives"

      - name: processed_at
        description: "Timestamp when the record was processed by Spark into silver"
        tests:
          - not_null

  - name: int_electricity_tariff_tiers
    description: "Intermediate electricity tariffs tiers"
    columns:
      - name: consumer_category
        description: "Tariff category the price applies to - e.g. household or business, tariff tier (high/low), and block number where applicable"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'household', 'business' ]

      - name: label
        description: "Macedonian-language name of the billed component, e.g. active electrical energy consumption or distribution fee"
        tests:
          - not_null

      - name: metric
        description: "Unit of measurement for the price, e.g. kWh"
        tests:
          - not_null

      - name: value
        description: "Price per unit (per metric) in Macedonian Denar"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: tariff_type
        description: "Classification of the billed component derived from the label - e.g. 'energy' for active electrical energy consumption. Null for components not classified."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or tariff_type = 'energy'"

      - name: tariff_window_type
        description: "Tariff window applicable - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Household high-tariff consumption block, extracted from tariff_tier e.g. BT1 -> 1. Null for low tariff (HT) and undifferentiated high tariff (business BT), which have no block distinction. Member of the authority set in dim_electricity_tariff_blocks (cross-checked by assert_tariff_tiers_blocks_consistency)."
        tests: []

      - name: valid_from
        description: "When this tariff price becomes valid: the start of its EVN local date, as a UTC timestamp (ADR-021)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= current_timestamp()"

      - name: ingested_at
        tests:
          - not_null

      - name: processed_at
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - consumer_category
              - tariff_window_type
              - tariff_block_number
              - valid_from

  - name: int_electricity_tariff_fees
    description: "Intermediate electricity tariff fees with fee_type assignment"
    columns:
      - name: consumer_category
        description: "Tariff category the fee applies to - household or business"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'household', 'business' ]

      - name: label
        description: "Macedonian-language name of the fee component"
        tests:
          - not_null

      - name: metric
        description: "Unit of measurement for the fee"
        tests:
          - not_null

      - name: value
        description: "Fee value in Macedonian Denar"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: fee_type
        description: "Type of fee: distribution (per-kWh) or access (fixed monthly)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'distribution', 'access' ]

      - name: valid_from
        description: "When this fee becomes valid: the start of its EVN local date, as a UTC timestamp (ADR-021)"
        tests:
          - not_null

      - name: ingested_at
        tests:
          - not_null

      - name: processed_at
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - consumer_category
              - fee_type
              - valid_from

  - name: int_electricity_tariff_blocks
    description: "Intermediate electricity tariff consumption blocks"
    columns:
      - name: consumer_category
        description: "Tariff category the block applies to - household or business"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'household', 'business' ]

      - name: tariff_window_type
        description: "Tariff window type - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]

      - name: tariff_block_number
        description: "Consumption block number - authority set is dim_electricity_tariff_blocks (assert_tariff_tiers_blocks_consistency)"
        tests:
          - not_null

      - name: lower_bound_kwh
        description: "Lower bound of consumption in kWh for this block"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: upper_bound_kwh
        description: "Upper bound of consumption in kWh for this block"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: valid_from
        description: "When this block definition becomes valid: the start of its EVN local date, as a UTC timestamp (ADR-021)"
        tests:
          - not_null

      - name: ingested_at
        tests:
          - not_null

      - name: processed_at
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - consumer_category
              - tariff_window_type
              - tariff_block_number
              - valid_from

  - name: int_electricity_tariff_window_schedule
    description: "Intermediate tariff window schedule - exploded from hour ranges into one row per (day_of_week, hour) combination"
    columns:
      - name: day_of_week
        description: "ISO day of week - 1=Monday through 7=Sunday"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1 and day_of_week <= 7"

      - name: hour
        description: "Hour of day (0-23) - each row represents one specific hour"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and hour < 24"

      - name: tariff_window_type
        description: "Tariff window applicable at this day/hour combination - low or high"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'low', 'high' ]

      - name: valid_from
        description: "When this schedule entry becomes valid: the start of its EVN local date, as a UTC timestamp (ADR-021)"
        tests:
          - not_null

      - name: ingested_at
        tests:
          - not_null

      - name: processed_at
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - day_of_week
              - hour
              - valid_from

  - name: int_electricity_tariff_rates
    description: "Ephemeral: what one kWh costs under each tariff tier. One row per tier per period in which its price, distribution fee and block bounds all stay the same. Shared by fct_compute_offers (row in force at each census) and mart_gpu_forecast (current row)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tariff_tier_skey
              - valid_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valid_from < valid_to"
    columns:
      - name: tariff_tier_skey
        description: "Foreign key to dim_electricity_tariff_tiers"
        tests:
          - not_null
      - name: distribution_fee
        description: "Per-kWh distribution fee in MKD in force for the whole period (from dim_electricity_tariff_fees)"
      - name: vat_rate
        description: "household_vat_rate for households, 0 for business (a VAT-registered business reclaims it)"
      - name: valid_from
        description: "Start of the period: the latest valid_from of the tier, its fee and its block"
      - name: valid_to
        description: "End of the period: the earliest valid_to of the tier, its fee and its block"

  - name: int_exchange_rates
    description: "Intermediate exchange rates - inverse rate added"
    columns:
      - name: from_currency
        description: "Source currency"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'USD' ]

      - name: to_currency
        description: "Target currency"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'MKD' ]

      - name: value
        description: "USD to MKD exchange rate"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: inverse_value
        description: "MKD to USD exchange rate (1 / value)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "< value"

      - name: timestamp
        description: "Timestamp of the exchange rate snapshot"
        tests:
          - not_null

      - name: ingested_at
        tests:
          - not_null

      - name: processed_at
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - from_currency
              - to_currency
              - timestamp

unit_tests:
  # The fee changes on 1 March while the tier and block do not: each tier must split into a January-February row
  # at the old fee and a row from March at the new one. The low-tariff tier has no block, so null bounds.
  - name: int_electricity_tariff_rates_split_when_a_fee_changes
    model: int_electricity_tariff_rates
    given:
      - input: ref('dim_electricity_tariff_tiers')
        rows:
          - {skey: high_1, consumer_category: household, tariff_type: high, metric: MKD/kWh, value: 6.5, tariff_window_type: high, tariff_block_number: 1, valid_from: "2026-01-01 00:00:00", valid_to: "9999-12-31 00:00:00"}
          - {skey: low, consumer_category: household, tariff_type: low, metric: MKD/kWh, value: 3.0, tariff_window_type: low, tariff_block_number: null, valid_from: "2026-01-01 00:00:00", valid_to: "9999-12-31 00:00:00"}
      - input: ref('dim_electricity_tariff_fees')
        rows:
          - {consumer_category: household, fee_type: distribution, value: 1.2, valid_from: "2026-01-01 00:00:00", valid_to: "2026-03-01 00:00:00"}
          - {consumer_category: household, fee_type: access, value: 100.0, valid_from: "2026-01-01 00:00:00", valid_to: "2026-03-01 00:00:00"}
          - {consumer_category: household, fee_type: distribution, value: 1.4, valid_from: "2026-03-01 00:00:00", valid_to: "9999-12-31 00:00:00"}
          - {consumer_category: household, fee_type: access, value: 100.0, valid_from: "2026-03-01 00:00:00", valid_to: "9999-12-31 00:00:00"}
      - input: ref('dim_electricity_tariff_blocks')
        rows:
          - {consumer_category: household, tariff_window_type: high, tariff_block_number: 1, lower_bound_kwh: 0, upper_bound_kwh: 350, valid_from: "2026-01-01 00:00:00", valid_to: "9999-12-31 00:00:00"}
    expect:
      rows:
        - {tariff_tier_skey: high_1, tariff_value: 6.5, distribution_fee: 1.2, lower_bound_kwh: 0, upper_bound_kwh: 350, vat_rate: 0.18, valid_from: "2026-01-01 00:00:00", valid_to: "2026-03-01 00:00:00"}
        - {tariff_tier_skey: high_1, tariff_value: 6.5, distribution_fee: 1.4, lower_bound_kwh: 0, upper_bound_kwh: 350, vat_rate: 0.18, valid_from: "2026-03-01 00:00:00", valid_to: "9999-12-31 00:00:00"}
        - {tariff_tier_skey: low, tariff_value: 3.0, distribution_fee: 1.2, lower_bound_kwh: null, upper_bound_kwh: null, vat_rate: 0.18, valid_from: "2026-01-01 00:00:00", valid_to: "2026-03-01 00:00:00"}
        - {tariff_tier_skey: low, tariff_value: 3.0, distribution_fee: 1.4, lower_bound_kwh: null, upper_bound_kwh: null, vat_rate: 0.18, valid_from: "2026-03-01 00:00:00", valid_to: "9999-12-31 00:00:00"}
