name: 'transform'
version: '1.0.0'

profile: 'transform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Behavior-change flags, owned explicitly in version control per dbt docs:
# https://docs.getdbt.com/reference/global-configs/behavior-changes
# Generic-test kwargs must be nested under the `arguments:` key (dbt >= 1.10.5).
flags:
  require_generic_test_arguments_property: true

models:
  transform:
    staging:
      +schema: stg
    intermediate:
      +schema: int
    dwh:
      +schema: dwh
    marts:
      +schema: mrt

vars:
  # EVN prices exclude VAT; the household rate was checked on a real bill (ADR-021).
  household_vat_rate: 0.18
  # The EVN time-of-use schedule's day_of_week/hour are local time (ADR-021).
  evn_timezone: 'Europe/Skopje'
  # mart_gpu_forecast's horizon: the app's 30-day window plus the gap between rebuilds (ADR-021).
  forecast_days: 32
